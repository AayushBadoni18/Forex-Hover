<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width" />
<title>Forex Hover Pro</title>
<link rel="stylesheet" href="popup.css" />
<style>
  /* Fallback converter window, for pages where the floating panel can't open (chrome://, New Tab, Web Store). */
  body { min-height: 100vh; padding: 12px; }
  .cv { max-width: 380px; margin: 0 auto; }
  .wallpaper .w1 { top: 92px; left: -36px; }
  .wallpaper .w2 { top: 204px; left: 170px; }
  .wallpaper .w3 { top: 330px; right: -40px; }
  .wallpaper .w5 { top: 20px; right: -30px; }
</style>
</head>
<body>
<div class="wallpaper" aria-hidden="true">
  <i class="shape-ring w5"></i><i class="shape-pill w1"></i><i class="shape-bar w2"></i><i class="shape-sun w3"></i>
</div>
<main id="app"></main>
<script src="popup.js"></script>
</body>
</html>
