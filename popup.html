<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width" />
<title>Forex Hover Pro</title>
<link rel="stylesheet" href="popup.css" />
<style>
  body { width: 360px; min-height: 0; padding: 12px; font-size: 13px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .glass { padding: 14px; }

  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 10px; }
  .logo {
    width: 34px; height: 34px; border-radius: 11px; flex: none; display: grid; place-items: center;
    font-weight: 800; font-size: 16px; color: #fff; text-shadow: none;
    background: linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 40%, #5e5ce6));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 4px 14px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .title { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }
  .status { font-size: 11px; color: var(--fg-2); display: flex; align-items: center; gap: 5px; }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); transition: background 0.3s; }
  .status.off::before { background: var(--fg-3); box-shadow: none; }
  .grow { flex: 1; min-width: 0; }

  .amount-row { display: flex; align-items: center; gap: 8px; }
  #amount {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font-size: 38px; font-weight: 650; letter-spacing: -1.2px; font-variant-numeric: tabular-nums; padding: 2px 0;
  }
  #amount::placeholder { color: var(--fg-3); }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 10px; }
  .pair .capsule { width: 100%; }
  #swap {
    width: 38px; height: 38px; padding: 0; font-size: 16px;
    transition: transform 0.5s var(--spring), background 0.2s;
  }
  #swap.spin { transform: rotate(180deg); }

  .result { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hairline); }
  .res-main { display: flex; align-items: baseline; gap: 8px; }
  #res-amount { font-size: 30px; font-weight: 700; letter-spacing: -0.8px; color: var(--accent-text); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .res-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 11px; color: var(--fg-2); }
  .icon-btns { display: flex; gap: 6px; }
  .icon-btns .btn { padding: 6px 10px; font-size: 11.5px; }

  .also { display: flex; flex-direction: column; gap: 3px; margin-top: 10px; }
  .also-row {
    display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center;
    padding: 7px 10px; border-radius: 12px; background: var(--fill); cursor: pointer; border: 0; text-align: left;
    animation: enter 0.5s var(--spring) backwards; animation-delay: calc(var(--i) * 35ms);
    transition: background 0.2s, transform 0.3s var(--spring);
  }
  .also-row:hover { background: var(--fill-2); }
  .also-row:active { transform: scale(0.98); }
  .also-row b { font-variant-numeric: tabular-nums; font-weight: 650; }
  .also-row small { color: var(--fg-3); font-size: 11px; }

  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .section-head h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--fg-3); }
  .link { border: 0; background: none; color: var(--accent); font-size: 11.5px; font-weight: 600; cursor: pointer; padding: 2px 4px; }
  .hist { display: flex; flex-direction: column; gap: 2px; }
  .hist button {
    display: flex; justify-content: space-between; gap: 8px; border: 0; background: none; text-align: left;
    padding: 6px 4px; border-radius: 8px; cursor: pointer; font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .hist button:hover { background: var(--fill); }
  .hist span:last-child { color: var(--accent-text); font-weight: 600; }
  .empty { color: var(--fg-3); font-size: 12px; padding: 4px; }
  .err { color: #ff6961; font-size: 12px; margin-top: 10px; }

  .foot { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; font-size: 10.5px; color: var(--fg-3); }
  .foot a { color: inherit; }
</style>
</head>
<body>
<div class="wallpaper" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="stack">
  <header class="glass bar enter" style="--i:0">
    <div class="logo" aria-hidden="true">¤</div>
    <div class="grow">
      <div class="title">Forex Hover Pro</div>
      <div class="status" id="status">Active on pages</div>
    </div>
    <label class="switch" title="Enable on pages">
      <input type="checkbox" id="toggle-enabled" role="switch" aria-label="Enable hover conversion" />
      <span></span>
    </label>
  </header>

  <section class="glass enter" style="--i:1" aria-label="Converter">
    <div class="amount-row">
      <label for="amount" class="sr-only">Amount</label>
      <input id="amount" inputmode="decimal" autocomplete="off" placeholder="0" value="100" />
    </div>
    <div class="pair">
      <label class="sr-only" for="from">From currency</label>
      <select id="from" class="capsule"></select>
      <button id="swap" class="btn" aria-label="Swap currencies">⇄</button>
      <label class="sr-only" for="to">To currency</label>
      <select id="to" class="capsule"></select>
    </div>
    <div class="result" id="result" aria-live="polite">
      <div class="res-main"><span id="res-amount">—</span></div>
      <div class="res-meta">
        <span id="res-rate"></span>
        <span class="icon-btns">
          <button class="btn" id="copy">Copy</button>
          <button class="btn" id="chain" title="Use result as the next amount">Chain</button>
        </span>
      </div>
      <div class="also" id="also"></div>
      <div class="err" id="error" hidden></div>
    </div>
  </section>

  <section class="glass enter" style="--i:2" aria-label="Recent conversions">
    <div class="section-head"><h2>Recent</h2><button class="link" id="clear-history">Clear</button></div>
    <div class="hist" id="history"></div>
  </section>

  <footer class="foot enter" style="--i:3">
    <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates by ExchangeRate-API</a>
    <button class="btn" id="open-settings">Settings</button>
  </footer>
</main>
<script src="popup.js"></script>
</body>
</html>
